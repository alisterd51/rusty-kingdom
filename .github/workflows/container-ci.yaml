name: Container CI

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  CONTAINERS: "crud-server game-server game-frontend migration rauthy-init"

jobs:
  container-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to dhi.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push all containers (${{ matrix.arch }})
        uses: docker/bake-action@v6
        env:
          TAG: ${{ inputs.tag }}
          ARCH_SUFFIX: -${{ matrix.arch }}
        with:
          files: docker-bake.hcl
          push: true
          set: |
            *.platform=linux/${{ matrix.arch }}

  container-manifest:
    needs: container-build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifests
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          for container in $CONTAINERS; do
            docker buildx imagetools create \
              -t ghcr.io/alisterd51/rusty-${container}:${IMAGE_TAG} \
              -t ghcr.io/alisterd51/rusty-${container}:latest \
              ghcr.io/alisterd51/rusty-${container}:${IMAGE_TAG}-amd64 \
              ghcr.io/alisterd51/rusty-${container}:${IMAGE_TAG}-arm64
          done
